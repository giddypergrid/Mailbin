name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ghsrkpghruvhibqjuymr.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdoc3JrcGdocnV2aGlicWp1eW1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDE4NjMsImV4cCI6MjA5NDExNzg2M30.aHE9QL39UcSRJvw3P1bRGKTKzTbzQTNoD4RaOCe1XkE
          VITE_SUPABASE_FUNCTIONS_URL: https://ghsrkpghruvhibqjuymr.supabase.co/functions/v1
      - run: npx cap add android
      - name: Add custom URL scheme intent-filter
        run: |
          INTENT='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="mailbin"/></intent-filter>'
          sed -i "s|</activity>|${INTENT}</activity>|" android/app/src/main/AndroidManifest.xml
      - name: Inject Mailbin app icon (emergency bin on beige)
        run: |
          RES="android/app/src/main/res"
          # Legacy launcher icons (used pre-Android-8 + as fallback)
          for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${entry%%:*}"; size="${entry##*:}"
            convert resources/icon.png -resize ${size}x${size} "$RES/mipmap-$name/ic_launcher.png"
            convert resources/icon.png -resize ${size}x${size} "$RES/mipmap-$name/ic_launcher_round.png"
          done
          # Adaptive icon foreground (Android 8+)
          for entry in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            name="${entry%%:*}"; size="${entry##*:}"
            convert resources/icon-foreground.png -resize ${size}x${size} "$RES/mipmap-$name/ic_launcher_foreground.png"
          done
          # Adaptive icon background = solid beige (#f5f0e8)
          cat > "$RES/drawable/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#f5f0e8"/>
          </shape>
          XML
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mailbin-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
